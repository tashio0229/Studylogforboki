<style>
  /* ============================================================
     Design foundations — Apple-style (apple-design SKILL.md)
     Typography §15 / Materials §12 / Reduced motion §14 / Restraint §16
     ============================================================ */
  :root {
    color-scheme: light dark;
    /* Semantic colors (light) — Apple system palette */
    --o:      #34c759;  /* ○ green  */
    --o-bg:   rgba(52,199,89,0.14);
    --d:      #ff9f0a;  /* △ amber  */
    --d-bg:   rgba(255,159,10,0.16);
    --x:      #ff3b30;  /* ✕ red    */
    --x-bg:   rgba(255,59,48,0.13);
    --act:    #0a84ff;  /* action blue */
    --act-bg: rgba(10,132,255,0.12);

    /* Surfaces */
    --bg:        #f2f2f7;
    --bg-2:      #e9e9ef;
    --card:      #ffffff;
    --card-2:    #fbfbfd;
    --chrome:    rgba(248,248,252,0.72);
    --chrome-edge: rgba(255,255,255,0.65);
    --hair:      rgba(60,60,67,0.10);
    --hair-strong: rgba(60,60,67,0.20);

    /* Text */
    --tx:      #1c1c1e;
    --tx-2:    #3c3c43;
    --tx-3:    rgba(60,60,67,0.6);
    --tx-4:    rgba(60,60,67,0.42);

    /* Shadow (multi-layer, restrained) */
    --shadow-sm: 0 0.5px 1px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.05);
    --shadow:    0 1px 2px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.06), 0 12px 28px rgba(0,0,0,0.05);
    --shadow-lg: 0 2px 6px rgba(0,0,0,0.05), 0 10px 30px rgba(0,0,0,0.09), 0 24px 60px rgba(0,0,0,0.08);

    --radius:   18px;
    --radius-sm: 12px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --o:      #30d158;
      --o-bg:   rgba(48,209,88,0.20);
      --d:      #ff9f0a;
      --d-bg:   rgba(255,159,10,0.22);
      --x:      #ff453a;
      --x-bg:   rgba(255,69,58,0.22);
      --act:    #0a84ff;
      --act-bg: rgba(10,132,255,0.22);

      --bg:        #000000;
      --bg-2:      #0c0c0e;
      --card:      #1c1c1e;
      --card-2:    #232325;
      --chrome:    rgba(28,28,30,0.68);
      --chrome-edge: rgba(255,255,255,0.10);
      --hair:      rgba(255,255,255,0.10);
      --hair-strong: rgba(255,255,255,0.22);

      --tx:      #f5f5f7;
      --tx-2:    #e3e3e6;
      --tx-3:    rgba(235,235,245,0.62);
      --tx-4:    rgba(235,235,245,0.4);

      --shadow-sm: 0 0.5px 1px rgba(0,0,0,0.4);
      --shadow:    0 1px 3px rgba(0,0,0,0.5), 0 8px 24px rgba(0,0,0,0.5);
      --shadow-lg: 0 2px 6px rgba(0,0,0,0.55), 0 18px 48px rgba(0,0,0,0.6);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font: 100%/1.5 system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
    background: var(--bg);
    color: var(--tx);
    letter-spacing: 0;
    padding-bottom: 4rem;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .tnum { font-variant-numeric: tabular-nums; }

  /* ---------- Header (translucent, scroll-edge) §12 ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--chrome);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-top: 1px solid var(--chrome-edge);   /* bright top edge = light catching the material */
  }
  /* Scroll-edge effect: soft fade where content meets floating chrome (no hard 1px divider) */
  header::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -18px;
    height: 18px;
    pointer-events: none;
    background: linear-gradient(to bottom, var(--hair), transparent);
    opacity: 0.7;
  }
  .header-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0.85rem 1.5rem 0.95rem;
    display: flex;
    align-items: baseline;
    gap: 1.25rem;
    flex-wrap: wrap;
  }
  .brand {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin-right: auto;
  }
  .brand .updated {
    display: block;
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0;
    color: var(--tx-3);
    margin-top: 0.2rem;
  }
  .countdown { text-align: right; line-height: 1.05; }
  .countdown .num {
    font-size: 1.9rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--act);
  }
  .countdown.phase .num { font-size: 1.35rem; color: var(--d); }
  .countdown .lbl {
    display: block;
    font-size: 0.66rem;
    font-weight: 600;
    color: var(--tx-3);
    letter-spacing: 0.01em;
    margin-top: 0.1rem;
  }

  /* ---------- Layout ---------- */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 1.75rem 1.5rem 0;
    display: flex;
    flex-direction: column;
    gap: 1.75rem;
  }

  .sec-title {
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--tx-3);
    margin: 0 0 0.75rem 0.25rem;
  }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 1.4rem 1.5rem;
  }

  /* ---------- Today's directive (most obvious) §16 ---------- */
  .directive {
    box-shadow: var(--shadow-lg);
    border-radius: var(--radius);
    padding: 1.5rem 1.6rem 1.6rem;
    background:
      radial-gradient(120% 100% at 0% 0%, var(--act-bg), transparent 60%),
      var(--card);
  }
  .directive h2 {
    font-size: 1.3rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.15;
    margin-bottom: 0.25rem;
  }
  .directive .sub { color: var(--tx-3); font-size: 0.85rem; margin-bottom: 1.1rem; line-height: 1.45; }
  .d-block {
    display: flex;
    gap: 0.85rem;
    padding: 0.9rem 1rem;
    border-radius: var(--radius-sm);
    background: var(--card-2);
    margin-bottom: 0.7rem;
  }
  .d-block:last-child { margin-bottom: 0; }
  .d-block .ic { font-size: 1.15rem; line-height: 1.4; flex-shrink: 0; }
  .d-block .body { flex: 1; min-width: 0; }
  .d-block .head { font-weight: 700; font-size: 0.95rem; letter-spacing: -0.01em; margin-bottom: 0.15rem; }
  .d-block .detail { font-size: 0.86rem; color: var(--tx-2); line-height: 1.45; }
  .d-block.x    { box-shadow: inset 3px 0 0 var(--x); background: var(--x-bg); }
  .d-block.card { box-shadow: inset 3px 0 0 var(--act); }
  .d-block.lec  { box-shadow: inset 3px 0 0 var(--o); }
  .d-block.rev  { box-shadow: inset 3px 0 0 var(--d); }

  /* ---------- Pattern board ---------- */
  .board-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 1rem; margin-bottom: 0.85rem; flex-wrap: wrap;
  }
  .board-head .hint { font-size: 0.85rem; color: var(--tx-3); }
  .board-total { font-size: 0.85rem; color: var(--tx-3); font-weight: 600; white-space: nowrap; }
  .board-total b { color: var(--o); font-size: 1rem; }
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1rem;
  }
  .pcard {
    background: var(--card);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-sm);
    padding: 1rem 1.1rem 1.05rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }
  .pcard .top { display: flex; align-items: flex-start; gap: 0.5rem; }
  .pcard .idx {
    font-size: 1.05rem; font-weight: 800; letter-spacing: -0.02em;
    color: var(--act); flex-shrink: 0;
  }
  .pcard .name { font-weight: 700; font-size: 0.95rem; letter-spacing: -0.01em; line-height: 1.25; }
  .pcard .chap { font-size: 0.75rem; color: var(--tx-3); margin-top: 0.1rem; }
  .pcard .prog-row { display: flex; align-items: center; gap: 0.6rem; }
  .pcard .frac { font-size: 0.82rem; font-weight: 700; color: var(--tx-2); white-space: nowrap; }
  .pcard .frac b { color: var(--o); }
  .bar {
    flex: 1; height: 6px; border-radius: 3px;
    background: var(--bg-2); overflow: hidden;
  }
  .bar > span { display: block; height: 100%; border-radius: 3px; background: var(--o); }
  .dots { display: flex; flex-wrap: wrap; gap: 5px; }
  .dot { width: 15px; height: 15px; border-radius: 50%; flex-shrink: 0; }
  .dot.o { background: var(--o); }
  .dot.d { background: var(--d); }
  .dot.x { background: var(--x); }
  .pcard .when { font-size: 0.75rem; font-weight: 600; color: var(--tx-3); margin-top: 0.1rem; }
  .pcard .when.done { color: var(--o); }
  .pcard .when.plan { color: var(--act); }

  /* ---------- Stats ---------- */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 1rem;
    margin-bottom: 1.2rem;
  }
  .stat {
    padding: 0.9rem 1rem 1rem;
    border-radius: var(--radius-sm);
    background: var(--card-2);
  }
  .stat .n { font-size: 2.3rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .stat .k { font-size: 0.78rem; font-weight: 600; color: var(--tx-3); margin-top: 0.3rem; }
  .stat.o .n { color: var(--o); }
  .stat.d .n { color: var(--d); }
  .stat.x .n { color: var(--x); }
  .stat.tot .n { color: var(--tx); }
  .stat.warn .n { color: var(--d); }

  .stackbar { height: 14px; border-radius: 7px; overflow: hidden; display: flex; box-shadow: var(--shadow-sm); }
  .stackbar > span { height: 100%; }
  .stackbar .so { background: var(--o); }
  .stackbar .sd { background: var(--d); }
  .stackbar .sx { background: var(--x); }
  .legend { display: flex; gap: 1.1rem; flex-wrap: wrap; margin-top: 0.7rem; font-size: 0.8rem; color: var(--tx-2); }
  .legend .li { display: flex; align-items: center; gap: 0.4rem; }
  .legend .sw { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }

  .subj-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.75rem; margin-top: 1.2rem; }
  .subj {
    padding: 0.75rem 0.9rem; border-radius: var(--radius-sm);
    background: var(--card-2); display: flex; flex-direction: column; gap: 0.15rem;
  }
  .subj .sn { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.02em; }
  .subj .sk { font-size: 0.76rem; color: var(--tx-3); }

  /* ---------- Wins ---------- */
  .wins { list-style: none; display: flex; flex-direction: column; gap: 0.65rem; }
  .wins li { display: flex; gap: 0.7rem; font-size: 0.9rem; line-height: 1.45; color: var(--tx-2); }
  .wins li .ic { flex-shrink: 0; }
  .wins li b { color: var(--tx); font-weight: 700; }

  /* ---------- Week plan ---------- */
  .week { display: flex; flex-direction: column; }
  .wrow {
    display: flex; align-items: baseline; gap: 0.85rem;
    padding: 0.6rem 0.2rem; border-bottom: 1px solid var(--hair);
  }
  .wrow:last-child { border-bottom: none; }
  .wrow .day { font-weight: 700; font-size: 0.85rem; width: 2.8rem; flex-shrink: 0; color: var(--tx-2); }
  .wrow .task { flex: 1; font-size: 0.88rem; color: var(--tx-2); line-height: 1.4; }
  .wrow .st { flex-shrink: 0; font-size: 0.9rem; }
  .wrow.done .day, .wrow.done .task { color: var(--tx-3); }
  .wrow .st.ok { color: var(--o); }
  .maxims {
    margin-top: 1rem; padding-top: 0.9rem; border-top: 1px solid var(--hair);
    display: flex; flex-wrap: wrap; gap: 0.5rem;
  }
  .maxim {
    font-size: 0.76rem; color: var(--tx-3);
    background: var(--card-2); padding: 0.3rem 0.7rem; border-radius: 999px;
    font-weight: 600;
  }

  /* ---------- Review queue ---------- */
  .rq-head { display: flex; align-items: baseline; gap: 0.8rem; margin-bottom: 0.9rem; flex-wrap: wrap; }
  .rq-head .big { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.03em; color: var(--d); }
  .rq-head .lbl { font-size: 0.85rem; color: var(--tx-3); font-weight: 600; }
  details.rqg {
    border-radius: var(--radius-sm);
    background: var(--card-2);
    margin-bottom: 0.6rem;
    overflow: hidden;
  }
  details.rqg:last-child { margin-bottom: 0; }
  details.rqg > summary {
    list-style: none; cursor: pointer;
    padding: 0.75rem 1rem;
    display: flex; align-items: center; gap: 0.6rem;
    font-weight: 700; font-size: 0.9rem;
    user-select: none;
  }
  details.rqg > summary::-webkit-details-marker { display: none; }
  details.rqg > summary::after {
    content: "›"; margin-left: auto; font-size: 1.3rem; color: var(--tx-3);
    transform: rotate(90deg); transition: transform 0.25s ease; line-height: 1;
  }
  details.rqg[open] > summary::after { transform: rotate(-90deg); }
  details.rqg .rq-body { padding: 0 1rem 0.9rem; font-size: 0.86rem; color: var(--tx-2); line-height: 1.5; }
  details.rqg .cnt {
    font-size: 0.78rem; font-weight: 700; padding: 0.08rem 0.5rem;
    border-radius: 999px; background: var(--d-bg); color: var(--d); white-space: nowrap;
  }
  details.rqg.crit { background: var(--x-bg); }
  details.rqg.crit > summary { color: var(--x); }
  details.rqg.crit .cnt { background: var(--x); color: #fff; }

  /* ---------- Roadmap ---------- */
  .road-bar {
    display: flex; height: 30px; border-radius: 8px; overflow: hidden;
    box-shadow: var(--shadow-sm); margin-bottom: 0.5rem;
  }
  .road-seg {
    height: 100%; display: flex; align-items: center; justify-content: center;
    font-size: 0.68rem; font-weight: 700; color: #fff; white-space: nowrap;
    padding: 0 4px; overflow: hidden;
  }
  .road-wrap { position: relative; padding-top: 1.4rem; }
  .road-now {
    position: absolute; top: 0; transform: translateX(-50%);
    text-align: center; white-space: nowrap;
  }
  .road-now .tri { font-size: 0.7rem; color: var(--x); line-height: 1; }
  .road-now .l { font-size: 0.66rem; font-weight: 700; color: var(--x); }
  .road-legend { display: flex; flex-direction: column; gap: 0.45rem; margin-top: 0.9rem; }
  .road-legend .li { display: flex; gap: 0.6rem; font-size: 0.85rem; color: var(--tx-2); align-items: baseline; }
  .road-legend .sw { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; position: relative; top: 2px; }

  /* ---------- Footer ---------- */
  footer {
    max-width: 1100px; margin: 2.5rem auto 0; padding: 1.5rem;
    font-size: 0.78rem; color: var(--tx-4); text-align: center; line-height: 1.6;
  }
  footer code { background: var(--card-2); padding: 0.1rem 0.4rem; border-radius: 5px; color: var(--tx-3); }

  /* ---------- Motion (restrained) §16 / §14 ---------- */
  .reveal {
    opacity: 0;
    transform: translateY(8px);
    animation: rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    animation-delay: var(--rd, 0ms);
  }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  /* Instant, pointer-down feedback (§1) */
  .pcard, details.rqg > summary { transition: transform 0.12s ease-out; }
  details.rqg > summary:active,
  .pcard:active { transform: scale(0.99); }

  @media (prefers-reduced-motion: reduce) {
    .reveal { animation: fade 0.3s ease forwards; transform: none; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    details.rqg > summary::after { transition: none; }
    .pcard:active, details.rqg > summary:active { transform: none; }
  }
  @media (prefers-reduced-transparency: reduce) {
    header { background: var(--bg); backdrop-filter: none; -webkit-backdrop-filter: none; }
  }
  @media (prefers-contrast: more) {
    :root { --hair: rgba(60,60,67,0.4); --hair-strong: rgba(60,60,67,0.6); }
    .card, .pcard, .stat, .d-block, details.rqg, .directive { border: 1px solid var(--hair-strong); }
    header { border-bottom: 1px solid var(--hair-strong); }
  }
  @media (prefers-contrast: more) and (prefers-color-scheme: dark) {
    :root { --hair: rgba(255,255,255,0.4); --hair-strong: rgba(255,255,255,0.6); }
  }

  @media (max-width: 560px) {
    .header-inner { gap: 0.75rem; }
    .countdown .num { font-size: 1.5rem; }
    main { padding: 1.25rem 1rem 0; gap: 1.4rem; }
    .card, .directive { padding: 1.15rem 1.15rem; }
    .rec-form { grid-template-columns: 1fr; }
    .rec-body { padding: 0 1.15rem 1.15rem; }
    .rec-panel > summary { padding: 1rem 1.15rem; }
  }

  /* ============================================================
     Recording mode — 記録入力・疑似管理・エクスポート（機能層）
     閲覧ビューの上に足すレイヤー。確定DATAは書き換えず、記録は
     localStorage に載せ「記録依頼リスト」としてエクスポートする。
     exercise-log.md が唯一の正。ここは入力補助＋速報表示のみ。
     ============================================================ */

  /* --- Collapsible record panel (elevated card) §12 --- */
  .rec-panel {
    border-radius: var(--radius);
    background:
      radial-gradient(120% 100% at 100% 0%, var(--o-bg), transparent 55%),
      var(--card);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .rec-panel > summary {
    list-style: none;
    cursor: pointer;
    user-select: none;
    padding: 1.15rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.7rem;
    transition: transform 0.12s ease-out;
  }
  .rec-panel > summary::-webkit-details-marker { display: none; }
  .rec-panel > summary:active { transform: scale(0.99); }
  .rec-panel > summary .rp-title {
    font-size: 1.05rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15;
  }
  .rec-panel > summary .rp-sub { font-size: 0.78rem; color: var(--tx-3); font-weight: 600; }
  .rec-panel > summary::after {
    content: "›"; margin-left: auto; font-size: 1.4rem; color: var(--tx-3);
    transform: rotate(90deg); transition: transform 0.25s ease; line-height: 1; flex-shrink: 0;
  }
  .rec-panel[open] > summary::after { transform: rotate(-90deg); }
  .rp-badge {
    font-size: 0.72rem; font-weight: 700; padding: 0.12rem 0.55rem;
    border-radius: 999px; background: var(--act-bg); color: var(--act);
    white-space: nowrap; margin-left: 0.1rem;
  }
  .rec-body { padding: 0 1.5rem 1.5rem; }
  .rec-note {
    font-size: 0.78rem; color: var(--tx-3); line-height: 1.5;
    background: var(--card-2); padding: 0.7rem 0.85rem; border-radius: var(--radius-sm);
    margin-bottom: 1rem;
  }
  .rec-note b { color: var(--tx-2); font-weight: 700; }

  /* --- 今日のキュー（事前記入済み・叩くだけ） --- */
  .rec-queue { display: flex; flex-direction: column; gap: 0.55rem; margin-bottom: 1rem; }
  .rq-head {
    display: flex; align-items: center; gap: 0.5rem;
    font-size: 0.82rem; font-weight: 800; color: var(--tx-2); letter-spacing: 0.01em;
  }
  .rq-prog { margin-left: auto; font-size: 0.78rem; font-weight: 700; color: var(--tx-3); }
  .rq-item {
    display: flex; align-items: flex-start; gap: 0.75rem;
    padding: 0.7rem 0.8rem; border-radius: var(--radius-sm);
    border: 1px solid var(--hair-strong); background: var(--card-2);
  }
  .rq-item.done { background: var(--o-bg); border-color: color-mix(in srgb, var(--o) 35%, transparent); }
  .rq-main { flex: 1; min-width: 0; }
  .rq-ttl { font-size: 0.86rem; font-weight: 700; color: var(--tx); line-height: 1.35; }
  .rq-note { font-size: 0.72rem; color: var(--tx-3); margin-top: 0.2rem; line-height: 1.4; }
  .rq-donmemo { display: inline-block; font-size: 0.72rem; color: var(--tx-3); margin-top: 0.25rem; }
  .rq-glyph { font-weight: 900; }
  .rq-glyph.o { color: var(--o); } .rq-glyph.d { color: var(--d); } .rq-glyph.x { color: var(--x); }
  .rq-controls { display: flex; flex-direction: column; gap: 0.4rem; width: min(46%, 15rem); flex-shrink: 0; }
  .mark-btns.sm { gap: 0.35rem; }
  .mark-btns.sm .mark-btn { font-size: 1.1rem; padding: 0.35rem 0; border-width: 2px; }
  .rq-memo { font-size: 0.8rem; padding: 0.45rem 0.6rem; }
  .rq-undo {
    font: inherit; font-size: 0.72rem; font-weight: 700; color: var(--tx-3);
    background: transparent; border: 1px solid var(--hair-strong);
    border-radius: var(--radius-sm); padding: 0.35rem 0.6rem; cursor: pointer; flex-shrink: 0;
  }
  .rq-undo:active { transform: scale(0.97); }
  .rec-manual-head {

function daysUntil(dateStr) {
  const target = new Date(dateStr + "T00:00:00");
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((target - today) / 86400000);
}

  const timeStr = (ms) => { const d = new Date(ms); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };

      && SUBJECT_VALUES.has(r.subject)
      && typeof r.chapter === "string" && r.chapter
      && typeof r.example === "string" && r.example
      && MARKS.has(r.mark)
      && typeof r.ts === "number" && isFinite(r.ts);
  }
  function loadRecords() {
    let raw;
    try { raw = localStorage.getItem(LS_RECORDS); } catch (e) { return []; }
    if (!raw) return [];
    let parsed;
    try { parsed = JSON.parse(raw); } catch (e) { return []; }
    if (!Array.isArray(parsed)) return [];
    return parsed.filter(isValidRecord).map(r => ({
      id: (typeof r.id === "string" && r.id) ? r.id : newId(),
      subject: r.subject, chapter: r.chapter, example: r.example,
      subtitle: typeof r.subtitle === "string" ? r.subtitle : "",
      memo: typeof r.memo === "string" ? r.memo : "",
      mark: r.mark, ts: r.ts
    })).sort((a, b) => a.ts - b.ts);
  }
  function saveRecords() {

  }
  function loadOverlay() {

    try { localStorage.setItem(LS_OVERLAY, JSON.stringify(overlay)); } catch (e) { /* non-fatal */ }

    && typeof q.example === "string" && q.example
  ) : [];

  // キュー項目が今日すでに記録済みか（科目＋章＋例題番号の一致・当日分のみ）
  function queueDone(q) {
    const today = todayStr();
    return records.find(r => r.subject === q.subject && r.chapter === q.chapter
      && r.example === q.example && dateStr(r.ts) === today) || null;
  }

  const markGlyph = { o: "○", d: "△", x: "✕" };
  function renderQueue() {
    if (!QUEUE.length) { elQueue.hidden = true; return; }
    elQueue.hidden = false;
    const doneCount = QUEUE.filter(queueDone).length;
    elQueue.innerHTML =
      `<div class="rq-head">🎯 今日の予定（叩くだけ）<span class="rq-prog tnum">${doneCount}/${QUEUE.length}</span></div>` +
      QUEUE.map((q, i) => {
        const done = queueDone(q);
        const ch = chapterNum(q.chapter) || q.chapter;
        const sub = q.subtitle ? `「${esc(q.subtitle)}」` : "";
        const note = q.note ? `<div class="rq-note">${esc(q.note)}</div>` : "";
        if (done) {
          const memo = done.memo ? `<span class="rq-donmemo">📝 ${esc(done.memo)}</span>` : "";
          return `<div class="rq-item done" data-i="${i}">
            <div class="rq-main">
              <div class="rq-ttl"><span class="rq-glyph ${done.mark}">${markGlyph[done.mark]}</span> ${esc(q.subject)}・${esc(ch)} ${esc(q.example)}${sub}</div>
              ${note}${memo}
            </div>
            <button type="button" class="rq-undo" data-i="${i}" data-rid="${esc(done.id)}">取消</button>
          </div>`;
        }
        return `<div class="rq-item" data-i="${i}">
          <div class="rq-main">
            <div class="rq-ttl">${esc(q.subject)}・${esc(ch)} ${esc(q.example)}${sub}</div>
            ${note}
          </div>
          <div class="rq-controls">
            <div class="mark-btns sm" data-i="${i}">
              <button type="button" class="mark-btn o" data-mark="o" data-i="${i}">○</button>
              <button type="button" class="mark-btn d" data-mark="d" data-i="${i}">△</button>
              <button type="button" class="mark-btn x" data-mark="x" data-i="${i}">✕</button>
            </div>
            <input class="rec-input rq-memo" data-i="${i}" type="text" placeholder="メモ（任意）" autocomplete="off">
          </div>
        </div>`;
      }).join("");
  }

  elQueue.addEventListener("click", (e) => {
    const undo = e.target.closest(".rq-undo");
    if (undo) {
      const rid = undo.dataset.rid;
      records = records.filter(r => r.id !== rid);
      saveRecords();
      renderList();
      renderQueue();
      applyLiveOverlay();
      return;
    }
    const btn = e.target.closest(".mark-btn");
    if (!btn) return;
    const i = Number(btn.dataset.i);
    const q = QUEUE[i];
    if (!q || !MARKS.has(btn.dataset.mark)) return;
    const memoEl = elQueue.querySelector(`.rq-memo[data-i="${i}"]`);
    pushRecord({
      subject: q.subject, chapter: q.chapter, example: q.example,
      subtitle: q.subtitle || "", memo: memoEl ? memoEl.value.trim() : "",
      mark: btn.dataset.mark
    });
  });

  // 記録追加の共通処理（手入力フォームと今日のキューの両方から使う）
  function pushRecord({ subject, chapter, example, subtitle, memo, mark }) {
    records.push({
      id: newId(),
      subject, chapter, example,
      subtitle: subtitle || "",
      memo: memo || "",
      mark,
      ts: Date.now()
    });
    records.sort((a, b) => a.ts - b.ts);
    saveRecords();
    renderList();
    renderQueue();
    applyLiveOverlay();
  }

  function addRecord() {
    const example = elExample.value.trim();
    if (!MARKS.has(selectedMark)) { elErr.textContent = "理解度（○ / △ / ✕）を選んでください。"; return; }
    if (!example) { elErr.textContent = "例題番号を入力してください（例: 例5）。"; elExample.focus(); return; }
    elErr.textContent = "";
    pushRecord({
      subject: elSubject.value,
      chapter: elChapter.value,
      example,
      subtitle: elSubtitle.value.trim(),
      memo: elMemo.value.trim(),
      mark: selectedMark
    });
    // 連続入力しやすいよう科目・章は保持、それ以外をクリア
    elExample.value = ""; elSubtitle.value = ""; elMemo.value = "";
    selectedMark = null;
    elMarks.querySelectorAll(".mark-btn").forEach(b => b.classList.remove("sel"));
    elExample.focus();
  }

  // ---- today's record list ----
  const elList = $("recList");
  const elTally = $("recTally");
  const elWarn = $("recWarn");
  const elBadge = $("recBadge");

  elList.addEventListener("click", (e) => {
    const del = e.target.closest(".rec-del");
    if (!del) return;
    const id = del.dataset.id;
    records = records.filter(r => r.id !== id);
    saveRecords();
    renderList();
    renderQueue();
    applyLiveOverlay();
  });

  function counts() {
    return {
      o: records.filter(r => r.mark === "o").length,
      d: records.filter(r => r.mark === "d").length,
      x: records.filter(r => r.mark === "x").length,
      total: records.length
    };
  }

  function renderList() {
    const c = counts();
    elTally.innerHTML =
      `<span class="big tnum">今日の記録 ${c.total}問</span>` +
      `<span class="brk">（<span class="co">○${c.o}</span> ／ <span class="cd">△${c.d}</span> ／ <span class="cx">✕${c.x}</span>）</span>`;

    const today = todayStr();
    const stale = records.filter(r => dateStr(r.ts) !== today).length;
    if (stale > 0) {
      elWarn.hidden = false;
      elWarn.textContent = `⚠ 前日以前の未エクスポート記録が ${stale}件 あります。エクスポートして反映してください。`;
    } else {
      elWarn.hidden = true;
    }

    if (!records.length) {
      elList.innerHTML = `<div class="rec-empty">まだ記録がありません。上のフォームから追加してください。</div>`;
    } else {
      elList.innerHTML = records.map(r => {
        const sub = r.subtitle ? `「${esc(r.subtitle)}」` : "";
        const memo = r.memo ? `<div class="memo">📝 ${esc(r.memo)}</div>` : "";
        return `
          <div class="rec-item ${r.mark}">
            <div class="rm">${markSym(r.mark)}</div>
            <div class="info">
              <div class="ttl">${esc(r.subject)} ${esc(r.chapter)} ${esc(r.example)}${sub}</div>
              <div class="sub2">${dateStr(r.ts)} ${timeStr(r.ts)}</div>
              ${memo}
            </div>
            <button type="button" class="rec-del" data-id="${esc(r.id)}" aria-label="この記録を削除" title="削除">✕</button>
          </div>`;
      }).join("");
    }
    updateBadge();
  }

  function updateBadge() {
    const n = records.length;
    if (n > 0) { elBadge.hidden = false; elBadge.textContent = `未反映 ${n}件`; }
    else { elBadge.hidden = true; }
    updateLocalStatus();
  }

  // ---- live overlay: 確定値に「+N」加算、ボードに pending ドット ----
  function applyLiveOverlay() {
    const c = counts();
    setStatLive(".stat.tot", c.total);
    setStatLive(".stat.o", c.o);
    setStatLive(".stat.d", c.d);
    setStatLive(".stat.x", c.x);
    applyPendingDots();
  }
  function setStatLive(sel, n) {
    const stat = document.querySelector(sel);
    if (!stat) return;
    let badge = stat.querySelector(".stat-live");
    if (n <= 0) { if (badge) badge.remove(); return; }
    if (!badge) {
      badge = document.createElement("div");
      badge.className = "stat-live";
      const nEl = stat.querySelector(".n");
      if (nEl) nEl.insertAdjacentElement("afterend", badge); else stat.appendChild(badge);
    }
    badge.textContent = `+${n} 今日`;
  }
  function applyPendingDots() {
    document.querySelectorAll(".dot.pending").forEach(el => el.remove());
    const pcards = Array.from(document.querySelectorAll(".pcard"));
    records.forEach(r => {
      if (r.subject !== "工業") return;          // ボードは管理会計(工業)章のみ
      const num = chapterNum(r.chapter);
      if (!num) return;
      const card = pcards.find(pc => {
        const chEl = pc.querySelector(".chap");
        return chEl && chapterNum(chEl.textContent) === num;
      });
      if (!card) return;
      const dots = card.querySelector(".dots");
      if (!dots) return;
      const dot = document.createElement("span");
      dot.className = `dot pending ${r.mark}`;
      dot.title = `${r.example} ${markSym(r.mark)}（今日の入力・未確定）`;
      dots.appendChild(dot);
    });
  }

  // ---- 疑似管理: 週間予定チェック / 今日の指令チェック（ローカル） ----
  function wireWeekPlan() {
    const rows = Array.from(document.querySelectorAll(".wrow"));
    rows.forEach((row, i) => {
      row.dataset.defaultDone = row.classList.contains("done") ? "1" : "0";
      row.classList.add("editable");
      row.setAttribute("role", "button");
      row.tabIndex = 0;
      const key = String(i);
      const apply = () => {
        const def = row.dataset.defaultDone === "1";
        const done = Object.hasOwn(overlay.week, key) ? !!overlay.week[key] : def;
        row.classList.toggle("done", done);
        row.classList.toggle("local-edit", Object.hasOwn(overlay.week, key) && (!!overlay.week[key] !== def));
        const st = row.querySelector(".st");
        if (st) { st.textContent = done ? "✅" : "◻︎"; st.classList.toggle("ok", done); }
      };
      const toggle = () => {
        const def = row.dataset.defaultDone === "1";
        const cur = Object.hasOwn(overlay.week, key) ? !!overlay.week[key] : def;
        overlay.week[key] = !cur;
        saveOverlay(); apply(); updateLocalStatus();
      };
      apply();
      row.addEventListener("click", toggle);
      row.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
    });
  }
  function wireDirective() {
    const blocks = Array.from(document.querySelectorAll(".directive .d-block"));
    blocks.forEach((b, i) => {
      const key = String(i);
      const chk = document.createElement("button");
      chk.type = "button";
      chk.className = "dblk-chk";
      chk.setAttribute("aria-label", "このタスクを完了にする（ローカル）");
      chk.title = "完了マーク（ローカル）";
      b.appendChild(chk);
      const apply = () => {
        const done = Object.hasOwn(overlay.dir, key) && !!overlay.dir[key];
        b.classList.toggle("done-local", done);
        chk.classList.toggle("on", done);
        chk.textContent = done ? "✓" : "";
      };
      chk.addEventListener("click", () => {
        const cur = Object.hasOwn(overlay.dir, key) && !!overlay.dir[key];
        overlay.dir[key] = !cur;
        saveOverlay(); apply(); updateLocalStatus();
      });
      apply();
    });
  }
  function overlayDiffs() {
    let n = 0;
    document.querySelectorAll(".wrow").forEach((row, i) => {
      const key = String(i);
      if (Object.hasOwn(overlay.week, key)) {
        const def = row.dataset.defaultDone === "1";
        if (!!overlay.week[key] !== def) n++;
      }
    });
    Object.keys(overlay.dir).forEach(k => { if (overlay.dir[k]) n++; });
    return n;
  }
  function updateLocalStatus() {
    const ls = $("localStatus");
    if (!ls) return;
    const diffs = overlayDiffs();
    if (diffs > 0) {
      ls.hidden = false;
      $("localStatusText").textContent = `ローカル変更あり ${diffs}件（週間予定/指令のチェック）`;
    } else {
      ls.hidden = true;
    }
  }
  $("localReset").addEventListener("click", () => {
    overlay.week = {}; overlay.dir = {};
    saveOverlay();
    document.querySelectorAll(".wrow").forEach((row, i) => {
      const done = row.dataset.defaultDone === "1";
      row.classList.toggle("done", done);
      row.classList.remove("local-edit");
      const st = row.querySelector(".st");
      if (st) { st.textContent = done ? "✅" : "◻︎"; st.classList.toggle("ok", done); }
    });
    document.querySelectorAll(".directive .d-block").forEach(b => {
      b.classList.remove("done-local");
      const chk = b.querySelector(".dblk-chk");
      if (chk) { chk.classList.remove("on"); chk.textContent = ""; }
    });
    updateLocalStatus();
  });

  // ---- export (=疑似push) ----
  function buildLines() {
    return records.map(r => {
      const sym = markSym(r.mark);
      const sub = r.subtitle ? `「${r.subtitle}」` : "";
      const memo = r.memo ? ` メモ:${r.memo}` : "";
      return `- ${r.subject} ${r.chapter} ${r.example}${sub} ${sym}${memo}`;
    });
  }
  const EXPORT_HEADER = "以下を exercise-log.md に記録してください（理解度は下記の通り。復習回数・次回復習日は既存ログのルールで計算し、確定値は上書きしないこと）:";
  function buildChatText() {
    if (!records.length) return "（記録がありません）";
    return EXPORT_HEADER + "\n" + buildLines().join("\n");
  }
  function buildFileText() {
    const body = records.length ? buildLines().join("\n") : "（記録がありません）";
    return `# 学習記録 ${todayStr()}（ダッシュボード入力分）\n\n${EXPORT_HEADER}\n\n${body}\n`;
  }
  function download(filename, text) {
    let url;
    try {
      const blob = new Blob([text], { type: "text/markdown;charset=utf-8" });
      url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
    } catch (e) { /* ignore */ }
    finally { if (url) setTimeout(() => URL.revokeObjectURL(url), 1500); }
  }
  async function copyText(text, btn) {
    let ok = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); ok = true; }
    } catch (e) { ok = false; }
    if (!ok) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text; ta.style.position = "fixed"; ta.style.top = "-9999px"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.focus(); ta.select();
        ok = document.execCommand("copy"); ta.remove();
      } catch (e) { ok = false; }
    }
    const orig = btn.dataset.orig || btn.textContent;
    btn.dataset.orig = orig;
    btn.textContent = ok ? "✓ コピーしました" : "コピー不可（テキストを手動選択してください）";
    setTimeout(() => { btn.textContent = orig; }, 1900);
  }

  let modalOpen = false;
  function openExport() {
    if (modalOpen) return;
    modalOpen = true;
    const back = document.createElement("div");
    back.className = "ov-back";
    back.innerHTML = `
      <div class="ov-sheet" role="dialog" aria-modal="true" aria-label="リポジトリ反映用エクスポート">
        <div class="ov-head">
          <h3>📤 エクスポート</h3>
          <button type="button" class="ov-close" aria-label="閉じる">✕</button>
        </div>
        <div class="ov-desc">この端末の記録を<b>反映用</b>に書き出します。ダッシュボードは直接pushできないため、下記を<b>チャットに貼る</b>か、DLした <b>.md をエージェントに渡す</b>と exercise-log.md に記録されます（復習回数・次回日はログ側で正しく計算）。</div>
        <div class="export-tabs">
          <button type="button" class="tab sel" data-tab="chat">チャット貼付用</button>
          <button type="button" class="tab" data-tab="file">ファイルDL</button>
        </div>
        <div class="export-pane" data-pane="chat">
          <textarea class="export-text" id="exportText" readonly></textarea>
          <p class="export-note">これをチャットに貼れば記録されます。</p>
          <div class="export-actions">
            <button type="button" class="btn primary" id="copyBtn">クリップボードにコピー</button>
          </div>
        </div>
        <div class="export-pane" data-pane="file" hidden>
          <p class="export-note">同じ内容を <b>study-log-${todayStr()}.md</b> としてダウンロードします。DLした .md をエージェントに渡せば適用されます。</p>
          <div class="export-actions">
            <button type="button" class="btn primary" id="dlBtn">⬇︎ .md をダウンロード</button>
          </div>
        </div>
        <div class="export-foot">
          <button type="button" class="btn danger wide" id="clearBtn">記録をエクスポート済みにする（リストをクリア）</button>
        </div>
      </div>`;
    document.body.appendChild(back);
    const sheet = back.querySelector(".ov-sheet");
    back.querySelector("#exportText").value = buildChatText();

    function close() {
      if (!modalOpen) return;
      modalOpen = false;
      back.remove();
      document.removeEventListener("keydown", onKey);
    }
    function onKey(e) { if (e.key === "Escape") close(); }
    document.addEventListener("keydown", onKey);
    back.addEventListener("click", (e) => { if (e.target === back) close(); });
    back.querySelector(".ov-close").addEventListener("click", close);

    back.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        const name = tab.dataset.tab;
        back.querySelectorAll(".tab").forEach(t => t.classList.toggle("sel", t === tab));
        back.querySelectorAll(".export-pane").forEach(p => { p.hidden = p.dataset.pane !== name; });
      });
    });
    back.querySelector("#copyBtn").addEventListener("click", (e) => copyText(buildChatText(), e.currentTarget));
    back.querySelector("#dlBtn").addEventListener("click", () => download(`study-log-${todayStr()}.md`, buildFileText()));
    back.querySelector("#clearBtn").addEventListener("click", () => {
      if (!records.length) { close(); return; }
      const ok = window.confirm("今日の記録リストをクリアします。エクスポート（コピー or DL）は済みましたか？\nOKでクリアします。");
      if (!ok) return;
      records = [];
      saveRecords();
      renderList();
      renderQueue();
      applyLiveOverlay();
      close();
    });
    sheet.focus && sheet.focus();
  }
  $("recExport").addEventListener("click", openExport);

  // ---- init ----
  wireWeekPlan();
  wireDirective();
  renderList();
  renderQueue();
  applyLiveOverlay();
  updateLocalStatus();
})();
</script>
